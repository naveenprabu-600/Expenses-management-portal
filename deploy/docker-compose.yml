# Adept Expense Portal: database, API, web app and log shipper.
#
# Expects both repositories cloned side by side:
#   ./expense-portal-api   (this file is in its deploy/ folder)
#   ./expense-portal-web
#
# Copy .env.example to .env, fill it in, then:  docker compose up -d --build

name: expense-portal

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: expenses
      POSTGRES_USER: expenses
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expenses -d expenses"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ..
    image: expense-portal-api:local
    environment:
      DB_URL: jdbc:postgresql://db:5432/expenses
      DB_USER: expenses
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      EXPENSE_JWT_SECRET: ${EXPENSE_JWT_SECRET:?set EXPENSE_JWT_SECRET in .env}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-}
      APP_ENV: ${APP_ENV:-dev}
      SPRING_PROFILES_ACTIVE: log-file
      LOG_DIR: /var/log/expense-portal
    volumes:
      - api-logs:/var/log/expense-portal
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ../../expense-portal-web
    image: expense-portal-web:local
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8180}:8080"
    depends_on:
      - api
    restart: unless-stopped

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.15.5
    command: ["filebeat", "-e", "--strict.perms=false"]
    environment:
      APP_ENV: ${APP_ENV:-dev}
      ELASTICSEARCH_HOSTS: ${ELASTICSEARCH_HOSTS:?set ELASTICSEARCH_HOSTS in .env}
      ELASTICSEARCH_API_KEY: ${ELASTICSEARCH_API_KEY:?set ELASTICSEARCH_API_KEY in .env}
    volumes:
      - ./filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - api-logs:/var/log/expense-portal:ro
      - filebeat-data:/usr/share/filebeat/data
    depends_on:
      - api
    restart: unless-stopped

volumes:
  db-data:
  api-logs:
  filebeat-data:
